name: Sync Upstream

# 每天 UTC 02:00 自动检查上游是否有新版本，也可以手动指定 tag 触发
on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      upstream_tag:
        description: '指定上游 tag（留空则自动取最新稳定版）'
        required: false
        default: ''

jobs:
  sync:
    name: Check & Sync Upstream
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout FlClashHX
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # 优先用 SYNC_PAT（classic PAT，需要 repo + workflow scope）
          # 若未设置则回落到 GITHUB_TOKEN（PR 创建步骤可能失败）
          token: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}

      - name: Configure git identity
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # ────────────────────────────────────────────────────────────────
      # 1. 获取上游最新稳定 tag
      # ────────────────────────────────────────────────────────────────
      - name: Add upstream remote & fetch tags
        run: |
          git remote add upstream https://github.com/chen08209/FlClash.git
          git fetch upstream --tags --no-recurse-submodules

      - name: Determine target upstream tag
        id: target
        run: |
          if [ -n "${{ github.event.inputs.upstream_tag }}" ]; then
            TAG="${{ github.event.inputs.upstream_tag }}"
          else
            # 取最新稳定版 tag（纯 vX.Y.Z，不含任何连字符后缀）
            # 只保留完全匹配 vMAJOR.MINOR.PATCH 格式的 tag
            TAG=$(git tag --list 'v*' --sort=-version:refname \
                  | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' \
                  | head -1)
          fi

          if [ -z "$TAG" ]; then
            echo "::error::未能找到任何上游稳定版 tag（格式：vX.Y.Z），请检查 remote"
            exit 1
          fi

          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "🎯 目标上游 tag：$TAG"

      # ────────────────────────────────────────────────────────────────
      # 2. 判断此 tag 是否已经处理过或已合入
      # ────────────────────────────────────────────────────────────────
      - name: Check whether this tag was already synced
        id: check
        run: |
          TAG="${{ steps.target.outputs.tag }}"
          SYNC_BRANCH="sync/upstream-${TAG}"

          # 解析 tag 对应的 commit hash
          COMMIT=$(git rev-list -n1 "refs/tags/${TAG}" 2>/dev/null || git rev-list -n1 "$TAG" 2>/dev/null)
          if [ -z "$COMMIT" ]; then
            echo "::error::无法解析 tag ${TAG} 对应的 commit，请确认 tag 已通过 fetch --tags 拉取"
            exit 1
          fi
          echo "commit=$COMMIT" >> $GITHUB_OUTPUT
          echo "📌 上游 Tag ${TAG} → Commit: ${COMMIT}"

          # 1. 检查该 commit 是否已经合入当前 main
          if git merge-base --is-ancestor "$COMMIT" HEAD 2>/dev/null; then
            echo "already_synced=true"   >> $GITHUB_OUTPUT
            echo "skip_reason=ancestor"  >> $GITHUB_OUTPUT
            echo "ℹ️ 上游 tag ${TAG} 已经包含在当前分支中，代码已是最新状态，无需同步。"
            exit 0
          fi

          # 2. 检查远端是否已存在同名同步分支
          if git ls-remote --exit-code origin "refs/heads/${SYNC_BRANCH}" > /dev/null 2>&1; then
            echo "already_synced=true"         >> $GITHUB_OUTPUT
            echo "skip_reason=branch_exists"   >> $GITHUB_OUTPUT
            echo "ℹ️ 分支 ${SYNC_BRANCH} 已存在，跳过（已有 PR 处理中）"
            exit 0
          fi

          echo "already_synced=false" >> $GITHUB_OUTPUT
          echo "sync_branch=${SYNC_BRANCH}" >> $GITHUB_OUTPUT
          echo "✅ 发现未同步的新版本 ${TAG}，准备创建同步分支"

      # ────────────────────────────────────────────────────────────────
      # 3. 尝试自动 merge，推送分支
      # ────────────────────────────────────────────────────────────────
      - name: Create sync branch & merge upstream
        if: steps.check.outputs.already_synced == 'false'
        id: merge
        run: |
          TAG="${{ steps.target.outputs.tag }}"
          BRANCH="${{ steps.check.outputs.sync_branch }}"
          COMMIT="${{ steps.check.outputs.commit }}"

          git checkout -b "$BRANCH"
          echo "📌 正在合并上游 Commit: ${COMMIT}"

          # 尝试 merge 上游 commit；若有冲突则保留冲突标记并提交
          if git merge "$COMMIT" \
               --no-edit \
               -m "sync: merge upstream ${TAG} into FlClashHX"; then
            echo "has_conflicts=false" >> $GITHUB_OUTPUT
            echo "🎉 无冲突，自动合并成功"
          else
            echo "has_conflicts=true" >> $GITHUB_OUTPUT
            echo "⚠️ 存在冲突，提交冲突标记供 PR review"
            # 将所有文件（含冲突标记）加入暂存并提交
            git add -A
            if ! git diff --cached --quiet; then
              git commit \
                -m "sync: merge upstream ${TAG} [⚠️ CONFLICTS - need manual resolution]" \
                --no-verify
            fi
          fi

          git push origin "$BRANCH"

      # ────────────────────────────────────────────────────────────────
      # 4. 计算新 HX 版本号
      # ────────────────────────────────────────────────────────────────
      - name: Compute new HX version
        if: steps.check.outputs.already_synced == 'false'
        id: version
        run: |
          TAG="${{ steps.target.outputs.tag }}"
          VER="${TAG#v}"          # e.g.  0.9.3
          HX_VER="${VER}-hx.1"   # e.g.  0.9.3-hx.1
          HX_TAG="v${HX_VER}"    # e.g.  v0.9.3-hx.1
          echo "ver=$VER"         >> $GITHUB_OUTPUT
          echo "hx_ver=$HX_VER"  >> $GITHUB_OUTPUT
          echo "hx_tag=$HX_TAG"  >> $GITHUB_OUTPUT

      # ────────────────────────────────────────────────────────────────
      # 5. 准备 PR 标题与正文
      # ────────────────────────────────────────────────────────────────
      - name: Prepare PR content
        if: steps.check.outputs.already_synced == 'false'
        id: pr_content
        run: |
          TAG="${{ steps.target.outputs.tag }}"
          BRANCH="${{ steps.check.outputs.sync_branch }}"
          HAS_CONFLICTS="${{ steps.merge.outputs.has_conflicts }}"
          HX_TAG="${{ steps.version.outputs.hx_tag }}"
          HX_VER="${{ steps.version.outputs.hx_ver }}"

          if [ "$HAS_CONFLICTS" == "true" ]; then
            echo "title=⚠️ sync: 上游 ${TAG} → FlClashHX ${HX_TAG} [需解决冲突]" >> $GITHUB_OUTPUT

            cat > /tmp/pr_body.md << HEREDOC
          ## ⚠️ 上游同步：${TAG} → ${HX_TAG}

          本次同步检测到合并冲突，**需要手动解决后才能发布**。

          ### 常见冲突文件
          | 文件 | 原因 |
          |------|------|
          | \`.github/workflows/build.yaml\` | CI 仓库判断逻辑与上游不同 |
          | \`lib/common/constant.dart\` | appName / packageName / repository 不同 |
          | \`lib/views/about.dart\` | 内核 / 项目链接不同 |

          ### 手动解决步骤
          \`\`\`bash
          git fetch origin
          git checkout ${BRANCH}
          # 解决冲突标记后：
          git add -A
          git commit -m 'sync: resolve conflicts for ${TAG}'
          git push origin ${BRANCH}
          \`\`\`

          解决后在此 PR 点击 **Merge** 即可。

          ### 合并后发布
          在 Actions 页面运行 **Release FlClashHX** workflow，输入版本号 \`${HX_VER}\`。

          ### 上游变更对比
          https://github.com/chen08209/FlClash/releases/tag/${TAG}
          HEREDOC

          else
            echo "title=✅ sync: 上游 ${TAG} → FlClashHX ${HX_TAG} [无冲突，可直接合并]" >> $GITHUB_OUTPUT

            # 列出自定义 commit（从 tag 到 main）
            CUSTOM_LOG=$(git log --oneline "refs/tags/${TAG}..origin/main" 2>/dev/null | head -20 || echo "(无法列出)")

            cat > /tmp/pr_body.md << HEREDOC
          ## ✅ 上游同步：${TAG} → ${HX_TAG}

          本次同步**无冲突**，可直接合并发布。

          ### 合并后发布
          在 Actions 页面运行 **Release FlClashHX** workflow，输入版本号 \`${HX_VER}\`。

          ### 上游变更对比
          https://github.com/chen08209/FlClash/releases/tag/${TAG}

          ### FlClashHX 自定义改动（保留在此次 merge 中）
          \`\`\`
          ${CUSTOM_LOG}
          \`\`\`
          HEREDOC
          fi

      # ────────────────────────────────────────────────────────────────
      # 6. 开 Pull Request（使用专用 Action 避免权限问题）
      # ────────────────────────────────────────────────────────────────
      - name: Create Pull Request
        if: steps.check.outputs.already_synced == 'false'
        env:
          GH_TOKEN: ${{ secrets.SYNC_PAT || secrets.GITHUB_TOKEN }}
        run: |
          gh pr create \
            --repo   "${{ github.repository }}" \
            --title  "${{ steps.pr_content.outputs.title }}" \
            --body-file /tmp/pr_body.md \
            --base   main \
            --head   "${{ steps.check.outputs.sync_branch }}"

      - name: Summary
        if: always()
        run: |
          if [ "${{ steps.check.outputs.already_synced }}" == "true" ]; then
            if [ "${{ steps.check.outputs.skip_reason }}" == "ancestor" ]; then
              echo "### ✅ 代码已是最新状态" >> $GITHUB_STEP_SUMMARY
              echo "上游最新稳定版 ${{ steps.target.outputs.tag }} 已经包含在当前 main 中，无需同步。" >> $GITHUB_STEP_SUMMARY
            else
              echo "### ⏭️ 已跳过" >> $GITHUB_STEP_SUMMARY
              echo "上游 ${{ steps.target.outputs.tag }} 的同步分支已存在，无需重复创建。" >> $GITHUB_STEP_SUMMARY
            fi
          elif [ "${{ steps.merge.outputs.has_conflicts }}" == "true" ]; then
            echo "### ⚠️ 已创建 PR（存在冲突）" >> $GITHUB_STEP_SUMMARY
            echo "目标：${{ steps.target.outputs.tag }} → ${{ steps.version.outputs.hx_tag }}" >> $GITHUB_STEP_SUMMARY
            echo "请手动解决冲突后合并 PR，再运行 Release workflow 发布。" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ✅ 已创建 PR（无冲突）" >> $GITHUB_STEP_SUMMARY
            echo "目标：${{ steps.target.outputs.tag }} → ${{ steps.version.outputs.hx_tag }}" >> $GITHUB_STEP_SUMMARY
            echo "可直接合并 PR，再运行 Release workflow 发布。" >> $GITHUB_STEP_SUMMARY
          fi
